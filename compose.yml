# The production shape of the stack: just the worker. It reads its settings from .env
# (on a server: the real order API and mail server).
#
# Locally and in CI, a plain `docker compose ...` also loads compose.override.yml automatically,
# which adds the test-only services: the mock order API and Mailpit. On a server,
# compose.deploy.yml is layered on top instead, so the mock never runs there.
#
# No settings live here. Each app's defaults are in its appsettings.json; .env overrides them.
# The worker publishes no ports: it only calls out (API, SMTP) and writes to its volumes.

name: order-ingestion

services:
  worker:
    build:
      context: .
      dockerfile: src/OrderIngestion.Worker/Dockerfile
    env_file: .env
    volumes:
      - worker-data:/app/data
      - worker-logs:/app/logs
    restart: unless-stopped

volumes:
  worker-data:
  worker-logs:
