# The worker, the only service that runs in production. It reads its settings from .env
# (on a server: the real order API and mail server). A server runs this file alone:
#   docker compose up --build
#
# Locally and in CI, compose.cicd.yml is added on top for the test-only services
# (mock order API, Mailpit):
#   docker compose -f compose.yml -f compose.cicd.yml up --build
#
# No settings live here. Each app's defaults are in its appsettings.json; .env overrides them.
# The worker publishes no ports: it only calls out (API, SMTP) and writes to its volumes.

name: order-ingestion

services:
  worker:
    build:
      context: .
      dockerfile: src/OrderIngestion.Worker/Dockerfile
    env_file: .env
    volumes:
      - worker-data:/app/data
      - worker-logs:/app/logs
    restart: unless-stopped

volumes:
  worker-data:
  worker-logs:
