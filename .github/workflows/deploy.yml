name: Deploy

# Runs when a PR is merged into main: tests the merge commit, then deploys it.
# A PR closed without merging also fires this event; the `if` on the first job skips it.
#
# MOCK BY DEFAULT: no SSH. The deploy job writes the command it would run to the job summary.
# Set the repository variable DEPLOY_MODE=ssh (plus the secrets below) to make it real.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; queue the newer one instead of cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # The merge commit on main. (For a merged PR, github.sha points at the PR's merge ref instead.)
  DEPLOY_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

  # The server checks out the tested commit and builds the worker from compose.yml alone,
  # so the test-only services (compose.cicd.yml) are never deployed. See deploy/remote-deploy.sh.
  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    # Repository variables; no fallbacks here. The mock step shows placeholders when unset,
    # the real step refuses to run without them.
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Deploy (mock)
        if: vars.DEPLOY_MODE != 'ssh'
        run: |
          target="${DEPLOY_USER:-<DEPLOY_USER>}@${DEPLOY_HOST:-<DEPLOY_HOST>}"
          dir="${APP_DIR:-<DEPLOY_APP_DIR>}"
          {
            echo "### Mock deploy"
            echo "No server was contacted. With \`DEPLOY_MODE=ssh\` this job would run:"
            echo '```bash'
            echo "ssh $target \\"
            echo "  'APP_DIR=$dir DEPLOY_SHA=$DEPLOY_SHA bash -s' \\"
            echo "  < deploy/remote-deploy.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Mock deploy of $DEPLOY_SHA finished; see the job summary."

      # Real path. Needs secrets SSH_PRIVATE_KEY and SSH_KNOWN_HOSTS (output of
      # `ssh-keyscan <host>`), and variables DEPLOY_HOST, DEPLOY_USER, DEPLOY_APP_DIR.
      - name: Deploy over SSH
        if: vars.DEPLOY_MODE == 'ssh'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_HOST:?set the DEPLOY_HOST repository variable}"
          : "${DEPLOY_USER:?set the DEPLOY_USER repository variable}"
          : "${APP_DIR:?set the DEPLOY_APP_DIR repository variable}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The variables are meant to expand here, on the runner, and travel to the server.
          # shellcheck disable=SC2029
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR=$APP_DIR DEPLOY_SHA=$DEPLOY_SHA bash -s" \
            < deploy/remote-deploy.sh
