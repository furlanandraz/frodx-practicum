name: Test

# Every push to any branch: unit tests, then the whole stack in Docker with smoke tests.
# deploy.yml also calls this workflow, so nothing is deployed without passing it.
on:
  push:
    branches: ["**"]
  workflow_call:
    inputs:
      ref:
        description: Commit to test. Empty means the commit that triggered the run.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --configuration Release --no-build
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  stack:
    name: Stack smoke tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Create .env
        run: cp .env.example .env

      # The worker (compose.yml) plus the test-only mock API and Mailpit (compose.cicd.yml).
      - name: Start stack
        run: docker compose -f compose.yml -f compose.cicd.yml up --detach --build --wait --wait-timeout 180

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      - name: Show container logs
        if: failure()
        run: docker compose -f compose.yml -f compose.cicd.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f compose.yml -f compose.cicd.yml down --volumes
